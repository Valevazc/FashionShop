<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

<header class="bg-dark text-white py-4 mb-5">
	<div class="container d-flex justify-content-between align-items-center">
		<a href="../index.html" class="btn btn-outline-light btn-sm">← Volver a la tienda</a>
		<h1 class="h3 mb-0">Iniciar sesión</h1>
		<span style="width: 160px;"></span>
	</div>
</header>

<div class="container" style="max-width: 400px;">
<div class="card shadow-sm p-4">

	<h2 class="h4 text-center mb-1">¡Bienvenido/a!</h2>
	<p class="text-center text-muted mb-4">Iniciá sesión con tu usuario y contraseña</p>

	<form onsubmit="return false;">
		<div class="mb-3">
			<label for="usuario" class="form-label">Usuario</label>
			<input type="text" id="usuario" name="usuario" class="form-control" required>
		</div>

		<div class="mb-4">
			<label for="password" class="form-label">Contraseña</label>
			<input type="password" id="password" name="password" class="form-control" required>
		</div>

		<button type="button" id="login" class="btn btn-primary w-100">Iniciar sesión</button>
	</form>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../scripts/loginAdmin.js"></script>
</body>
</html>

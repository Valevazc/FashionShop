<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FashionShop - Gestión</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

<header class="bg-dark text-white py-4 mb-4">
	<div class="container d-flex justify-content-between align-items-center">
		<a href="../index.html" class="btn btn-outline-light btn-sm">← Volver a la tienda</a>
		<h1 class="h3 mb-0">Gestión de administrador</h1>
		<a href="../index.html" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
	</div>
</header>

<div class="container mb-5">

	<div class="mb-4">
		<button type="button" class="btn btn-primary" id="btnRegistrar">Registrar +</button>
	</div>

	<div id="registrar" class="card shadow-sm p-4 mb-5 d-none">
		<h2 class="h5 mb-3">Registrar mercadería</h2>

		<div class="mb-3">
			<label for="nombreProducto" class="form-label">Nombre</label>
			<input type="text" id="nombreProducto" name="nombreProducto" class="form-control" placeholder="Ej: Campera de cuero">
		</div>

		<div class="mb-3">
			<label for="seccionProducto" class="form-label">Sección</label>
			<select id="seccionProducto" class="form-select">
				<option value="mujeres">Mujeres</option>
				<option value="hombres">Hombres</option>
				<option value="chicos">Chicos</option>
			</select>
		</div>

		<div class="mb-3">
			<label for="precioProducto" class="form-label">Precio</label>
			<input type="number" id="precioProducto" name="precioProducto" class="form-control" placeholder="Ej: 2000">
		</div>

		<div class="mb-3">
			<label for="imgProducto" class="form-label">Enlace de la imágen</label>
			<input type="text" id="imgProducto" name="imgProducto" class="form-control" placeholder="Ej: https://www.shutterstock.com/es/search/gorros">
		</div>

		<div class="mb-3">
			<label for="stockProducto" class="form-label">Stock disponible</label>
			<input type="number" id="stockProducto" name="stockProducto" class="form-control" placeholder="Ej: 5">
		</div>

		<button type="button" class="btn btn-success" id="guardarProducto">Guardar y publicar</button>
	</div>

	<div class="productosYaRegistrados mb-5">
		<h2 class="h4 mb-3">Productos registrados</h2>

		<h3 id="seccion-mujeres" class="h5 border-bottom pb-2 mb-3">Mujeres</h3>
		<div id="productosMujeres" class="row mb-4">
			<p class="text-muted">No has registrado nada aún</p>
		</div>

		<h3 id="seccion-hombres" class="h5 border-bottom pb-2 mb-3">Hombres</h3>
		<div id="productosHombres" class="row mb-4">
			<p class="text-muted">No has registrado nada aún</p>
		</div>

		<h3 id="seccion-chicos" class="h5 border-bottom pb-2 mb-3">Chicos</h3>
		<div id="productoschicos" class="row mb-4">
			<p class="text-muted">No has registrado nada aún</p>
		</div>
	</div>

	<div class="ventasRealizadas">
		<div class="d-flex justify-content-between align-items-center mb-3">
			<h2 class="h4 mb-0">Ventas realizadas</h2>
			<button type="button" class="btn btn-outline-danger btn-sm" onclick="eliminarVentas()">Limpiar historial de ventas</button>
		</div>
		<div id="listaVentas" class="row"></div>
	</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../scripts/productos.js"></script>
<script src="../scripts/calculosCarrito.js"></script>
<script src="../scripts/gestionAdmin.js"></script>
</body>
</html>

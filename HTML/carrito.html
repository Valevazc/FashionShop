<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FashionShop - Carrito</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>

<body class="bg-light">

<header class="bg-dark text-white py-4 mb-4">
	<div class="container d-flex justify-content-between align-items-center">
		<a href="../index.html" class="btn btn-outline-light btn-sm">← Volver a la tienda</a>
		<h1 class="h3 mb-0">Tu carrito</h1>
		<span style="width: 160px;"></span> 
	</div>
</header>

<div class="container mb-5">

	<div id="productosCarrito" class="row"></div>

	<div class="mb-3">
		<label class="form-label d-block fw-bold">Método de pago</label>
		<div class="form-check form-check-inline">
			<input class="form-check-input" type="radio" name="metodoPago" id="pagoOtro" value="otro" checked onchange="mostrarTotalCarrito()">
			<label class="form-check-label" for="pagoOtro">Efectivo / Crédito</label>
		</div>
		<div class="form-check form-check-inline">
			<input class="form-check-input" type="radio" name="metodoPago" id="pagoDebito" value="debito" onchange="mostrarTotalCarrito()">
			<label class="form-check-label" for="pagoDebito">Débito (10% de descuento)</label>
		</div>
	</div>

	<div class="d-flex flex-wrap gap-2 my-4">
		<button type="button" class="btn btn-secondary" onclick="actualizarCantidad()">Actualizar carrito</button>
		<button type="button" id="confirmarCompra" class="btn btn-success ms-auto" onclick="confirmarCompra()">Confirmar compra</button>
	</div>

	<div id="totalCarrito" class="alert alert-info"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../scripts/productos.js"></script>
<script src="../scripts/calculosCarrito.js"></script>
<script src="../scripts/carrito.js"></script>
</body>
</html>
